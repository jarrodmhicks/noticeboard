     The die and the back arrow are hand drawn. -->

<noscript><p class="ns">Your senses are always on. Notice them.<small>This board draws its tiles with JavaScript, so it needs JavaScript turned on to show prompts.</small></p></noscript>
<label id="hap" aria-hidden="true" style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:.01;overflow:hidden;pointer-events:none"><input type="checkbox" switch tabindex="-1"></label>
<main class="wrap">
  <h1 class="sr">Notice Board</h1>
  <div class="stack" id="stack">

    <!-- The board: a frame holding a 14 x 6 grid of flip tiles (built by js/board.js) -->
    <div class="frame" id="frame">
      <div class="board" id="board" aria-hidden="true"></div>
      <div class="plate" aria-hidden="true">Notice Board</div>
    </div>
    <!-- Screen readers get the board's text here, since the tiles are hidden from them -->
    <div class="sr" id="live" aria-live="polite"></div>

    <!-- The cable between board and panel (drawn by js/cable.js) -->
    <div class="rig" id="rig"><svg id="wires" aria-hidden="true"></svg></div>

    <!-- The control panel, tilted back like a tabletop box -->
    <div class="table" id="table">
      <div class="panel" id="panel">
        <i class="scr a"></i><i class="scr b"></i><i class="scr c"></i><i class="scr d2"></i>
        <i class="port" id="port"></i>
        <div class="box">
          <!-- six sense buttons, created by js/controls.js -->
          <div class="keys" id="senses"></div>
          <!-- right side: sound fader (created by js/controls.js) above the back and copy keys -->
          <div class="swcol" id="swcol">
            <div class="sndrow" id="sndrow"></div>
            <div class="cprow">
              <button class="cbtn" id="back" aria-label="Previous prompt">
                <span class="sock"><span class="top"><svg class="pic" aria-hidden="true"><use href="#i-back"/></svg></span></span>
              </button>
              <button class="cbtn" id="copy" aria-label="Copy link to this prompt">
                <span class="sock"><span class="top"><svg class="pic" aria-hidden="true"><use href="#i-link"/></svg></span></span>
              </button>
            </div>
          </div>
        </div>
        <a class="mk" id="mk" href="https://psychophyshicks.com" target="_blank" rel="noopener" aria-label="psychophyshicks.com">psychophyshicks</a>
      </div>
    </div>

    <p class="err" id="err"></p>
  </div>
</main>

<!-- Scripts share one global scope, so the order matters: each file only uses things from the files above it. -->
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/board.js"></script>
<script src="js/prompts.js"></script>
<script src="js/cable.js"></script>
<script src="js/controls.js"></script>
<script src="js/main.js"></script>
</body>
</html>
